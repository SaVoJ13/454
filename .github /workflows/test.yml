name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Клонування репозиторію
        uses: actions/checkout@v4
      - name: Встановлення Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Запуск тестів
        run: npm test
